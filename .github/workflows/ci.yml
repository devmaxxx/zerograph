name: ci
# A push to a branch with an open PR fires both events on the same commit, so branches are tested
# through the PR and main after the merge; workflow_dispatch runs a branch that has no PR yet.
# A draft PR is not tested: its runs are spent on commits nobody is reviewing yet, and marking it
# ready for review starts the run.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
jobs:
  # One job definition, three platforms. Everything a user does around the binary — install it,
  # start it, ask it under a path that is not ASCII, let Claude Code's shell find `claude` — is
  # the same question on all three, and asking it on one was how the Windows answers stayed
  # unknown until a Windows job existed. What is genuinely per-platform is gated by `if` and
  # named for what only that platform can be asked.
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      # A red on one platform must not cancel the other two: which platforms a change breaks is
      # the whole answer, and a cancelled job reports nothing.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, exe: target/debug/zerograph, pack: linux-x64 }
          - { os: macos-14, exe: target/debug/zerograph, pack: darwin-arm64 }
          - { os: windows-latest, exe: target/debug/zerograph.exe, pack: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      # The repository is LF throughout and the tests compare bytes; a checkout the runner's
      # git had converted to CRLF would be a different corpus. A no-op off Windows, written for
      # every platform because the setting is global and the reason is not platform-specific.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # The small model, kept between runs: the dense arm is opened here and nowhere else in CI,
      # on runners with no GPU. Outside the workspace on purpose — `changes` below reads the
      # checkout's untracked files, and 470 MB of model is not something a diff changed. Written
      # here rather than in the job's `env`, which may not read the `runner` context at all.
      - shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "FASTEMBED_CACHE_DIR=$env:RUNNER_TEMP/model-cache"
      - uses: dtolnay/rust-toolchain@1.98.0
        with: { components: clippy }
      - run: cargo clippy --all-targets -- -D warnings
      # Every integration test too: the socket, the day a user has with the binary under a
      # Cyrillic path, and the transport seam each platform brings its own half of.
      - run: cargo test

      # The bench kit's own tests, which no job ran: the judge that decides whether a reading is a
      # reading, the comparison harness, the run history, and the two the kit's root holds — the
      # admission replay and the held-out reading. They are Python beside the shell they judge,
      # and a laptop was the only thing that had ever run them. One platform is enough —
      # what they test is arithmetic and parsing, not a transport seam — and it is this one because
      # the kit measures on Darwin and nothing here should need Darwin to be read. Each suite that
      # does shells out under a skip of its own: `/usr/bin/time -l` and `quiet.sh`'s reading of the
      # machine are Darwin's, and the cases that need them say so and are skipped rather than red.
      # One step per suite so each suite's red is reported under its own name, and `!cancelled()`
      # on every one of them so they all run anyway: a bare `if:` implies `success()`, and under it
      # a red in any earlier step would skip the rest and the split alone would buy nothing.
      - if: runner.os == 'Linux' && !cancelled()
        run: python3 -m unittest discover -s bench/probe
      # The comparison's truth is read with `rg`, which a laptop has and this image does not.
      - if: runner.os == 'Linux' && !cancelled()
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends ripgrep
      - if: runner.os == 'Linux' && !cancelled()
        run: python3 -m unittest discover -s bench/compare
      - if: runner.os == 'Linux' && !cancelled()
        run: python3 -m unittest discover -s bench/history
      # The marketplace hands out the Claude Code mod as it stood at the tag it names, so the mod's
      # version and that tag move with the crate's: a bump that left either behind would keep
      # every install on the previous release's mod.
      - if: runner.os == 'Linux' && !cancelled()
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mod=$(jq -r .version agent/claude-code/.claude-plugin/plugin.json)
          ref=$(jq -r '.plugins[] | select(.name == "zerograph") | .source.ref' .claude-plugin/marketplace.json)
          [ "$mod" = "$crate" ] || { echo "::error::agent/claude-code is at $mod, Cargo.toml at $crate"; exit 1; }
          [ "$ref" = "v$crate" ] || { echo "::error::the marketplace pins $ref, Cargo.toml is at $crate"; exit 1; }

      # The agent hook is JavaScript and ships with the binary that installs it, so it is tested on
      # the same three platforms: a hook that throws on Windows is a hook that fires on nobody.
      # `!cancelled()` for the same reason as the suites above, and with no OS clause beside it: a
      # red Python suite must not skip the hook on the one platform it also runs on.
      - if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - if: ${{ !cancelled() }}
        run: node --test agent/hook.test.mjs npm/zerograph/test/launcher.test.js

      # A default Git for Windows install puts `git` on PATH and not `sh` — the Unix tools are an
      # opt-in — so `ask --rerank` looks for one. Route 1: Git's shell directories
      # come off PATH, `git` itself stays, and the shell is found beside it. Windows only: unix
      # has `sh` on PATH by construction, and there is no install without it to imitate.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\(usr\\)?bin\\?$' }) -join ';'
          if (Get-Command sh -ErrorAction SilentlyContinue) { throw "sh is still on PATH: $((Get-Command sh).Source)" }
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) { throw "git left PATH too; the pattern is wrong" }
          cargo test -- command:: rerank::
          if ($LASTEXITCODE -ne 0) { throw "route 1, the shell beside git: $LASTEXITCODE" }

      # Route 1 answers first on any box with Git on PATH, so the other two have never run on a
      # runner. Here Git leaves PATH entirely — a portable Git, or Claude Code's own bash and
      # nothing else — and each remaining route is taken alone, the last of them to nowhere.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          # The resolver's own two questions, asked the way it asks them — a file at
          # `<dir>\sh.exe` or `<dir>\git.exe` — rather than through `Get-Command`, which also
          # reads aliases and PATHEXT and would answer a slightly different question.
          function OnPath($exe) { ($env:PATH -split ';' | Where-Object { $_ -and (Test-Path (Join-Path $_ $exe)) }) -join ', ' }
          function Fail($m) { Write-Host "::error::$m"; exit 1 }
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\' }) -join ';'
          if (OnPath 'sh.exe') { Fail "sh is still on PATH: $(OnPath 'sh.exe')" }
          if (OnPath 'git.exe') { Fail "git is still on PATH: $(OnPath 'git.exe')" }
          $empty = Join-Path $env:RUNNER_TEMP 'no-git-here'
          New-Item -ItemType Directory -Force -Path $empty | Out-Null

          cargo test -- command:: rerank::
          if ($LASTEXITCODE -ne 0) { Fail "route 3, the installer's own place under Program Files: $LASTEXITCODE" }

          $env:ProgramFiles = $empty
          $env:ProgramW6432 = $empty
          $env:LOCALAPPDATA = $empty
          $env:CLAUDE_CODE_GIT_BASH_PATH = 'C:\Program Files\Git\bin\bash.exe'
          cargo test -- command:: rerank::
          if ($LASTEXITCODE -ne 0) { Fail "route 2, the bash Claude Code names: $LASTEXITCODE" }

          # Nowhere left to look. A green run here is a resolver that found a shell it should not
          # have, so the exit code is inverted and the message it failed with is read. What each
          # place holds is printed either way: a green here is a finding, and a finding needs the
          # directory that answered, not the guess of one.
          Remove-Item Env:CLAUDE_CODE_GIT_BASH_PATH
          foreach ($k in 'ProgramFiles','ProgramW6432','LOCALAPPDATA') {
            $v = [Environment]::GetEnvironmentVariable($k)
            Write-Host "$k = $v ; Git there: $(Test-Path (Join-Path $v 'Git\bin\sh.exe')) $(Test-Path (Join-Path $v 'Programs\Git\bin\sh.exe'))"
          }
          Write-Host "CLAUDE_CODE_GIT_BASH_PATH = '$([Environment]::GetEnvironmentVariable('CLAUDE_CODE_GIT_BASH_PATH'))'"
          Write-Host "sh.exe on PATH: '$(OnPath 'sh.exe')' ; git.exe on PATH: '$(OnPath 'git.exe')'"
          $out = (cargo test -- command:: rerank:: 2>&1) | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) { Fail "a shell was found with nowhere left to find one" }
          if ($out -notmatch 'is not on PATH and no Git for Windows was found') { Fail "it failed for another reason" }
          # The run above is meant to fail, and pwsh hands a step the last exit code it saw.
          exit 0

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/model-cache
          key: e5-small-onnx-${{ runner.os }}-1
      # The one place ONNX Runtime opens a session and embeds, on each platform's own build of it.
      - run: cargo test --test serve -- --ignored --nocapture a_fused_answer_is_resident_on_the_small_model
      # Whether the hub client linked each blob into the snapshot or moved it there: an account
      # without symlink rights takes the second path, and a user's box is that account.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem -Recurse $env:FASTEMBED_CACHE_DIR | Where-Object { $_.Attributes -match 'ReparsePoint' } | Select-Object FullName

      # hf-hub's cache walk, tokenizers' file read and ORT's own path handling under a home
      # directory that is not ASCII — `C:\Users\Максим\.cache\…` is the box this is written for,
      # and the job's own cache path is ASCII. A copy and not a link: a junction or a symlink
      # would resolve back to the ASCII path and prove nothing.
      - shell: pwsh
        env:
          FASTEMBED_CACHE_DIR: ${{ runner.temp }}/Максим/.cache/fastembed
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path $env:FASTEMBED_CACHE_DIR | Out-Null
          Copy-Item -Recurse -Force -Path "${{ runner.temp }}/model-cache/*" -Destination $env:FASTEMBED_CACHE_DIR
          cargo test --test serve -- --ignored --nocapture a_fused_answer_is_resident_on_the_small_model
          if ($LASTEXITCODE -ne 0) { throw "the model did not open under a Cyrillic cache path: $LASTEXITCODE" }

      # `changes` hands the repository path to `git -C` and reads the diff back onto the graph.
      # The checkout is the corpus, built on the binary `cargo test` has already made — a release
      # build here cost three and a half minutes to judge codegen nothing in this step is about.
      # A line goes into a tracked file first, so there is a diff for the step to name.
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = "${{ matrix.exe }}"
          $built = (& $exe --no-dense --repo . build) | Out-String
          if ($built -notmatch 'nodes [1-9]') { throw "the build over the checkout wrote no nodes: $built" }
          Add-Content -Path README.md -Value 'A line this step added, and takes back.'
          $changes = (& $exe --no-dense --repo . changes --base HEAD) | Out-String
          if ($LASTEXITCODE -ne 0) { throw "changes exited $LASTEXITCODE" }
          if ($changes -notmatch 'README\.md') { throw "the diff of the file just edited names nothing: $changes" }
          git checkout -- README.md

      # The `### On Windows` section of the README, verbatim, on a runner: a repository under a
      # Cyrillic path with a space, a `zerograph.toml` as Windows PowerShell 5.1 writes one
      # (byte-order mark, CRLF), the background server started the way the README says to start
      # one, and the socket a `Stop-Process` leaves for the next `serve` to sweep. The same day
      # in Rust is `tests/users_day.rs`, which runs on all three; what only this can judge is the
      # PowerShell the README prints, and PowerShell is the only shell that has that problem.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          function Fail($m) { Write-Host "::error::$m"; exit 1 }
          $R = "$env:RUNNER_TEMP\Проект beauty crm"
          New-Item -ItemType Directory -Force -Path "$R\docs" | Out-Null
          Set-Content -Encoding utf8 "$R\docs\pay.md" "**FR-PAY-1 · MUST · Штраф за отмену**`n`nШтраф списывается сам.`n"
          # Windows PowerShell 5.1, not pwsh: `Out-File -Encoding utf8` there writes a byte-order
          # mark and CRLF, which is what an editor on this platform leaves in the file. Re-encoded
          # from a plain copy so the command line carries no quoting of its own to get wrong.
          Set-Content -Encoding utf8 "$R\toml.src" @('id_families = ["FR-PAY"]', 'embed_model = "intfloat/multilingual-e5-small"')
          powershell.exe -NoProfile -Command "Get-Content '$R\toml.src' | Out-File -Encoding utf8 '$R\zerograph.toml'"
          Remove-Item "$R\toml.src"
          $head = [System.IO.File]::ReadAllBytes("$R\zerograph.toml")[0..2] -join ','
          if ($head -ne '239,187,191') { Fail "PowerShell 5.1 stopped writing a byte-order mark; this step no longer tests one: $head" }
          $exe = "$env:GITHUB_WORKSPACE\target\debug\zerograph.exe"
          $built = (& $exe --repo $R build) | Out-String
          if ($built -notmatch 'nodes [1-9]') { Fail "the build under a Cyrillic path wrote no nodes: $built" }
          # The README's own line, and its working directory rather than a `--repo` of its own:
          # `Start-Process -ArgumentList` joins its elements with spaces and quotes none of them,
          # so a repository path with a space in it would reach `clap` as three arguments.
          $log = "$env:RUNNER_TEMP\serve.err"
          $serve = Start-Process $exe -ArgumentList 'serve','--idle','86400' -WorkingDirectory $R -WindowStyle Hidden -RedirectStandardError $log -PassThru
          $deadline = (Get-Date).AddSeconds(120)
          do {
            $answer = (& $exe --repo $R ask штраф 2>&1) | Out-String
            if ($answer -match 'answered by the resident process') { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if ($answer -notmatch 'answered by the resident process') {
            Write-Host "serve exited: $($serve.HasExited); its stderr:"
            Get-Content $log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            Fail "the README's recipe left no server answering: $answer"
          }
          if ($answer -notmatch 'Штраф за отмену') { Fail "the resident process answered something else: $answer" }
          Stop-Process -Id $serve.Id
          # The socket is wherever `status` says it checked: under the home cache, not the checkout.
          $sock = (& $exe --repo $R status --json | ConvertFrom-Json).serve.socket
          if (-not $sock) { Fail "status --json named no socket" }
          if (-not (Get-Item -Force $sock -ErrorAction SilentlyContinue)) { Fail "a killed server left no socket for the next serve to sweep" }
          & $exe --repo $R --no-dense serve --idle 1
          if ($LASTEXITCODE -ne 0) { Fail "the next serve would not bind over the dead socket: $LASTEXITCODE" }
          if (Get-Item -Force $sock -ErrorAction SilentlyContinue) { Fail "and the socket outlived its server" }
          exit 0

      # What a user installs, on the platform they install it on: the pack script, npm's own
      # shim, `bin/zerograph.js` finding this platform's binary, the `files` whitelist, a
      # Cyrillic argument through the shim, and the exit code coming back. Last in the job,
      # because packing rewrites the version in `npm/*/package.json`.
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          bash scripts/npm-pack.sh 0.0.0-ci ${{ matrix.pack }}=${{ matrix.exe }}
          if ($LASTEXITCODE -ne 0) { throw "the pack script failed: $LASTEXITCODE" }
          $launcher = (Get-Item "dist/npm/zerograph-0.0.0-ci.tgz").FullName
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value

          # A project directory with a space and a letter that is not ASCII, and a package.json
          # written by hand: `npm init -y` would take the directory's name for the package's.
          $proj = Join-Path $env:RUNNER_TEMP 'проект node'
          New-Item -ItemType Directory -Force -Path $proj | Out-Null
          Set-Content -Encoding utf8 (Join-Path $proj 'package.json') '{ "name": "consumer", "version": "1.0.0", "private": true }'
          Push-Location $proj
          npm i --no-audit --no-fund $launcher
          if ($LASTEXITCODE -ne 0) { throw "the install failed: $LASTEXITCODE" }
          $reported = ((npx zerograph --version) | Out-String).Trim()
          if ($reported -ne "zerograph $version") { throw "the launcher ran something else: $reported" }

          $R = Join-Path $proj 'корпус'
          New-Item -ItemType Directory -Force -Path (Join-Path $R 'docs') | Out-Null
          Set-Content -Encoding utf8 (Join-Path $R 'docs/pay.md') "**FR-PAY-1 · MUST · Штраф за отмену**`n`nШтраф списывается сам.`n"
          Set-Content -Encoding utf8 (Join-Path $R 'zerograph.toml') 'id_families = ["FR-PAY"]'
          npx zerograph --repo $R --no-dense build | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "a build through the launcher failed: $LASTEXITCODE" }
          $answer = ((npx zerograph --repo $R --no-dense ask штраф) | Out-String)
          if ($answer -notmatch 'Штраф за отмену') { throw "the question or the answer did not survive the shim: $answer" }
          npx zerograph --repo $R explain nope
          if ($LASTEXITCODE -ne 1) { throw "the launcher swallowed the exit code: $LASTEXITCODE" }

          # The third status, through the same shim: a question that was answered "no" exits 3,
          # which is neither the 1 above nor the 2 the launcher writes with no platform binary
          # behind it. A harness reads those three apart, and this is the only job that reads them
          # through npm's shim. Two top-level functions, one calling the other, so a call path
          # exists one way round and not the other.
          Set-Content -Encoding utf8 (Join-Path $R 'billing.ts') "export function refund(id: string) {`n  return write(id);`n}`n`nexport function write(id: string) {`n  return id;`n}`n"
          npx zerograph --repo $R --no-dense build | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the rebuild through the launcher failed: $LASTEXITCODE" }
          npx zerograph --repo $R --no-dense trace write refund
          if ($LASTEXITCODE -ne 3) { throw "a verdict through the shim should exit 3, not $LASTEXITCODE" }

          # An upgrade under a live server: the launcher runs a copy kept under LOCALAPPDATA, so the
          # package's own binary can be overwritten while a detached `serve` answers, and `stop` ends it.
          if ($IsWindows) {
            npx zerograph --repo $R --no-dense serve --detach --idle 600
            if ($LASTEXITCODE -ne 0) { throw "serve --detach through the launcher failed: $LASTEXITCODE" }
            $copy = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'zerograph\bin\0.0.0-ci-*\zerograph.exe') -ErrorAction SilentlyContinue
            if (-not $copy) { throw "the launcher kept no copy under $env:LOCALAPPDATA\zerograph\bin" }
            $pkg = Join-Path $proj 'node_modules\zerograph\bin\win32-x64\zerograph.exe'
            Copy-Item -Force $pkg "$pkg.new"
            Move-Item -Force "$pkg.new" $pkg
            if (-not $?) { throw "the package's binary was locked by the running server" }
            $sock = (npx zerograph --repo $R status --json | ConvertFrom-Json).serve.socket
            if (-not $sock) { throw "status --json through the launcher named no socket" }
            npx zerograph --repo $R stop
            if ($LASTEXITCODE -ne 0) { throw "stop through the launcher failed: $LASTEXITCODE" }
            if (Get-Item -Force $sock -ErrorAction SilentlyContinue) { throw "stop left the socket behind" }
          }
          Pop-Location

          # And a pack run given no binary for this platform: a named platform and an exit code, not
          # a stack trace.
          bash scripts/npm-pack.sh 0.0.0-ci
          if ($LASTEXITCODE -ne 0) { throw "the pack script failed with no binary: $LASTEXITCODE" }
          $alone = Join-Path $env:RUNNER_TEMP 'launcher-alone'
          New-Item -ItemType Directory -Force -Path $alone | Out-Null
          Set-Content -Encoding utf8 (Join-Path $alone 'package.json') '{ "name": "alone", "version": "1.0.0", "private": true }'
          Push-Location $alone
          npm i --no-audit --no-fund $launcher
          if ($LASTEXITCODE -ne 0) { throw "installing the launcher alone failed: $LASTEXITCODE" }
          $said = ((npx zerograph --version 2>&1) | Out-String)
          if ($LASTEXITCODE -ne 2) { throw "a launcher with no binary behind it should exit 2, not $LASTEXITCODE" }
          if ($said -notmatch 'packed without the ${{ matrix.pack }} binary') { throw "and name the platform that is missing: $said" }
          Pop-Location
          git checkout -- npm/

  bench:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `secrets` is not readable from a job-level `if`; a step output is.
      - id: token
        run: echo "present=${{ secrets.BENCH_REPO_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: olkp1/beauty-crm
          token: ${{ secrets.BENCH_REPO_TOKEN }}
          path: corpus
      - if: steps.token.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@1.98.0
      - if: steps.token.outputs.present == 'true'
        run: cargo build --release
      - if: steps.token.outputs.present == 'true'
        run: ./target/release/zerograph --repo corpus --no-dense build
      - if: steps.token.outputs.present == 'true'
        run: ./target/release/zerograph --repo corpus --no-dense bench
      # A green job that ran nothing would read as a passed bench.
      - if: steps.token.outputs.present != 'true'
        run: echo "::warning::BENCH_REPO_TOKEN is not set; the bench did not run"
