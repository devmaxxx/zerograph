name: release
on:
  push:
    tags: ['v*']
  # A run from a branch builds, smokes and packs every target and publishes nothing, so a
  # platform new to the matrix is proven on a runner before a version number is spent on it.
  workflow_dispatch:
jobs:
  # npm-pack.sh versions the packages from the tag and the binary reports Cargo.toml's, so a tag
  # that names another version would publish one under the other's number, and a number spent on
  # the npm registry is never given back.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME#v}" = "$crate" ] || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml's $crate"; exit 1; }
  build:
    needs: version
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    # New repos default GITHUB_TOKEN to read-only; softprops/action-gh-release's own
    # README states it needs contents: write to create a release and upload assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czf zerograph-${{ matrix.target }}.tar.gz zerograph
      # Run once before it is packed: the ONNX Runtime this links on Windows is pyke's DirectML
      # build and imports a DLL nothing here ships, so a binary that cannot load says so in this
      # log, on a runner carrying only the inbox copy, rather than on a user's machine.
      - if: runner.os == 'Windows'
        run: |
          .\target\${{ matrix.target }}\release\zerograph.exe --version
          Compress-Archive -Path .\target\${{ matrix.target }}\release\zerograph.exe -DestinationPath zerograph-${{ matrix.target }}.zip
      # A dispatch run has no release to put the archive on. It is kept as a run artifact instead,
      # so the file a runner just built and smoked can be fetched with `gh run download` and tried
      # on a real machine before a tag is spent; a tag run skips this and publishes as it did.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: zerograph-${{ matrix.target }}
          path: zerograph-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: "zerograph-${{ matrix.target }}.${{ matrix.ext }}" }
  # SHA256SUMS and the provenance attestations, from the archives as they sit on the release, so
  # both name the bytes a user fetches. A job of its own because it needs `id-token`: the build
  # job runs every dependency's build script, and a token mintable there would pass npm's trusted
  # publishing as well as Sigstore. Nothing here compiles or runs repository code. The binary is
  # attested beside its archive because npm installs the binary alone, and that is the file a
  # user holds when they run `gh attestation verify`.
  verify:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --pattern 'zerograph-*.tar.gz' --pattern 'zerograph-*.zip'
          sha256sum zerograph-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" SHA256SUMS --clobber
          mkdir -p bin/darwin-arm64 bin/linux-x64 bin/win32-x64
          tar -C bin/darwin-arm64 -xzf zerograph-aarch64-apple-darwin.tar.gz
          tar -C bin/linux-x64 -xzf zerograph-x86_64-unknown-linux-gnu.tar.gz
          unzip -q zerograph-x86_64-pc-windows-msvc.zip -d bin/win32-x64
        env: { GH_TOKEN: "${{ github.token }}" }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            zerograph-*.tar.gz
            zerograph-*.zip
            bin/darwin-arm64/zerograph
            bin/linux-x64/zerograph
            bin/win32-x64/zerograph.exe
  # The npm package carries all three binaries, cut from the release assets above, so the binary
  # an `npm install` runs is byte-for-byte the one on the release page. It goes to the npm
  # registry through trusted publishing: npm trusts this workflow's OIDC token, so there is no
  # registry secret to keep, and every version carries a provenance attestation. Trusted publishing
  # can only be configured on a package that exists, so its first version was published by
  # hand (docs/bench/runbook.md). scripts/npm-pack.sh packs the same tarball.
  npm:
    # After `verify`, so a version whose attestation failed is never published: npm will not take
    # the same version twice, and the docs promise every binary it ships verifies.
    needs: [build, verify]
    # Only a tag has a release to download from and a version to publish under.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # Node 22 ships npm 10; trusted publishing needs 11.5.1 or later.
      - run: npm install -g npm@11.20.0
      - run: gh release download "$GITHUB_REF_NAME" --pattern 'zerograph-*.tar.gz' --pattern 'zerograph-*.zip'
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: |
          mkdir -p bin/darwin-arm64 bin/linux-x64 bin/win32-x64
          tar -C bin/darwin-arm64 -xzf zerograph-aarch64-apple-darwin.tar.gz
          tar -C bin/linux-x64 -xzf zerograph-x86_64-unknown-linux-gnu.tar.gz
          unzip -q zerograph-x86_64-pc-windows-msvc.zip -d bin/win32-x64
          scripts/npm-pack.sh "${GITHUB_REF_NAME#v}" darwin-arm64=bin/darwin-arm64/zerograph linux-x64=bin/linux-x64/zerograph win32-x64=bin/win32-x64/zerograph.exe
      # A version already on the registry is skipped, so a rerun after a failure publishes rather
      # than stopping at the refusal. `npm view` of a version the package lacks exits 0 with nothing
      # printed, hence the test on its output.
      - run: |
          v=${GITHUB_REF_NAME#v}
          if [ -n "$(npm view "zerograph@$v" version 2>/dev/null)" ]; then echo "zerograph@$v is published already"; else npm publish "dist/npm/zerograph-$v.tgz"; fi
  # The crate is the tag's source, through crates.io's trusted publishing: the action trades this
  # workflow's OIDC token for a token that lives for the run, so there is no registry secret to keep.
  # Like npm's, trusted publishing can only be configured on a crate that exists, so the first
  # version was published by hand (docs/bench/runbook.md).
  crates:
    # After `verify` for the same reason as npm: a version number on crates.io is never given back.
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # A version already on the registry is skipped, so a rerun after a failure, or the tag of the
      # version published by hand, publishes nothing rather than failing on the refusal.
      - run: |
          v=${GITHUB_REF_NAME#v}
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'zerograph-release (github.com/devmaxxx/zerograph)' "https://crates.io/api/v1/crates/zerograph/$v")
          if [ "$code" = 200 ]; then echo "zerograph@$v is published already"; else cargo publish --locked; fi
        env: { CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}" }
